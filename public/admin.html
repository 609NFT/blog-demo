<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · Notes</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#fdfcfa" />
<link rel="icon" href="data:image/svg+xml,<svg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22><rect%20x=%2212%22%20y=%2212%22%20width=%2276%22%20height=%2276%22%20rx=%2218%22%20fill=%22%23d97706%22/></svg>" />
<link rel="stylesheet" href="/styles.css" />
<style>
  .admin-body { background: var(--bg); }
  .brand-lg { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; letter-spacing: -0.02em; color: var(--text); }
  .brand-lg span { color: var(--accent); }

  /* Login */
  .login-screen { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
  .login-card {
    width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 30px 26px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px;
  }
  .login-card p { margin: 0; font-size: .92rem; }
  .login-card input, .field input, .field textarea, .field select {
    width: 100%; font-family: var(--font-sans); font-size: 1rem; color: var(--text);
    background: var(--bg); border: 1px solid var(--border-strong); border-radius: 8px; padding: 11px 13px;
  }
  .login-card input:focus, .field input:focus, .field textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .login-error { color: var(--accent); font-size: .88rem; }

  /* Buttons */
  .btn-primary, .btn-ghost, .btn-danger, .mini-btn {
    font-family: var(--font-sans); font-weight: 600; font-size: .9rem; cursor: pointer;
    border-radius: 8px; padding: 10px 16px; min-height: 42px; border: 1px solid transparent; transition: all 140ms ease;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-ghost { background: transparent; color: var(--muted); border-color: var(--border-strong); }
  .btn-ghost:hover { color: var(--text); border-color: var(--text); }
  .btn-danger { background: transparent; color: #dc2626; border-color: rgba(220,38,38,0.4); }
  .btn-danger:hover { background: rgba(220,38,38,0.08); }
  .mini-btn { min-height: 30px; padding: 4px 12px; font-size: .78rem; background: var(--code-bg); color: var(--muted); border-color: var(--border); }
  .mini-btn:hover { color: var(--accent); }

  /* App shell */
  .admin-top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  .admin-actions { display: flex; gap: 8px; align-items: center; }
  .admin-layout { display: grid; grid-template-columns: 1fr; gap: 0; max-width: 1200px; margin: 0 auto; }
  @media (min-width: 860px) { .admin-layout { grid-template-columns: 300px 1fr; } }

  .admin-list { border-right: 1px solid var(--border); padding: 16px; }
  .list-head { padding: 4px 6px 12px; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  #post-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  #post-list li { border-radius: 8px; }
  #post-list li.active { background: var(--accent-soft); }
  .post-item { width: 100%; text-align: left; background: transparent; border: none; cursor: pointer; padding: 10px 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 3px; }
  .post-item:hover { background: var(--code-bg); }
  .pi-title { font-weight: 600; font-size: .95rem; color: var(--text); }
  .pi-meta { font-size: .78rem; text-transform: capitalize; }

  .admin-editor, .admin-empty { padding: 24px; }
  .admin-empty { display: grid; place-items: center; min-height: 40vh; text-align: center; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: .82rem; font-weight: 600; color: var(--text-2, var(--text)); display: flex; align-items: center; gap: 10px; }
  .field .hint { font-weight: 400; color: var(--faint); font-size: .78rem; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field textarea { resize: vertical; line-height: 1.5; }
  .field .mono { font-family: var(--font-mono); font-size: .9rem; }
  .preview-pane { border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; background: var(--surface); max-width: none; }
  .editor-actions { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .editor-actions .btn-danger { margin-left: auto; }
  .save-status { font-size: .85rem; color: var(--muted); }

  .admin-toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px);
    background: var(--text); color: var(--bg); font-weight: 600; font-size: .9rem;
    padding: 11px 18px; border-radius: 10px; box-shadow: var(--shadow); opacity: 0;
    transition: opacity 220ms ease, transform 220ms ease; z-index: 50; pointer-events: none;
  }
  .admin-toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body class="admin-body">
  <div id="login" class="login-screen">
    <form id="login-form" class="login-card">
      <div class="brand-lg">Notes <span>Admin</span></div>
      <p class="muted">Enter the admin password to manage posts.</p>
      <input id="password" type="password" placeholder="Admin password" autocomplete="current-password" />
      <button type="submit" class="btn-primary">Sign in</button>
      <div id="login-error" class="login-error" hidden></div>
    </form>
  </div>

  <div id="app" class="admin-app" hidden>
    <header class="admin-top">
      <div class="brand-lg">Notes <span>Admin</span></div>
      <div class="admin-actions">
        <a href="/" target="_blank" rel="noopener" class="btn-ghost">View site ↗</a>
        <button id="new-post" class="btn-primary">+ New post</button>
        <button id="signout" class="btn-ghost">Sign out</button>
      </div>
    </header>
    <div class="admin-layout">
      <aside class="admin-list">
        <div class="list-head muted"><span id="post-count"></span></div>
        <ul id="post-list"></ul>
      </aside>
      <main class="admin-editor" id="editor" hidden>
        <form id="post-form">
          <div class="field"><label for="f-title">Title</label><input id="f-title" name="title" required /></div>
          <div class="grid2">
            <div class="field"><label for="f-slug">Slug</label><input id="f-slug" name="slug" /></div>
            <div class="field"><label for="f-date">Date</label><input id="f-date" name="date" type="date" /></div>
          </div>
          <div class="grid2">
            <div class="field"><label for="f-category">Category</label><input id="f-category" name="category" placeholder="product" /></div>
            <div class="field"><label for="f-author">Author</label><input id="f-author" name="author" placeholder="Your name" /></div>
          </div>
          <div class="field"><label for="f-tags">Tags <span class="hint">comma-separated</span></label><input id="f-tags" name="tags" placeholder="process, shipping" /></div>
          <div class="field"><label for="f-excerpt">Excerpt <span class="hint">shown on cards</span></label><textarea id="f-excerpt" name="excerpt" rows="2"></textarea></div>
          <div class="field">
            <label for="f-body">Body <span class="hint">Markdown</span> <button type="button" id="preview-toggle" class="mini-btn">Preview</button></label>
            <textarea id="f-body" name="body" rows="18" class="mono"></textarea>
            <div id="preview" class="prose preview-pane" hidden></div>
          </div>
          <div class="editor-actions">
            <button type="submit" class="btn-primary" id="save-btn">Save post</button>
            <button type="button" class="btn-ghost" id="cancel-btn">Cancel</button>
            <button type="button" class="btn-danger" id="delete-btn" hidden>Delete</button>
          </div>
        </form>
      </main>
      <div class="admin-empty" id="editor-empty">
        <p class="muted">Select a post to edit, or create a new one.</p>
      </div>
    </div>
  </div>

  <div id="toast" class="admin-toast" hidden></div>
  <script src="/admin.js"></script>
</body>
</html>
